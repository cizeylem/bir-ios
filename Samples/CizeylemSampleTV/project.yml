name: CizeylemSampleTV
options:
  deploymentTarget:
    tvOS: "15.0"
packages:
  Cizeylem:
    path: ../..
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GENERATE_INFOPLIST_FILE: YES
targets:
  CizeylemSampleTV:
    type: application
    platform: tvOS
    sources:
      - SampleApp.swift
      - ../Shared
    dependencies:
      - package: Cizeylem
        product: Cizeylem
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cizeylem.sample.tv
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
